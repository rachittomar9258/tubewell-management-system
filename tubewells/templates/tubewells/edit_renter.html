{% extends 'accounts/base.html' %}
{% block title %}Edit {{ renter.first_name }}{% endblock %}

{% block content %}
<style>
  :root{
    --ink:#1b2b2b;
    --paper:#f7f5ef;
    --paper-dim:#efece2;
    --water:#0e6ba8;
    --water-deep:#175e54;
    --flow:#2f8f4e;
    --stone:#8a8578;
    --line:#dedad0;
  }

  .tw-wrap{
    font-family:'IBM Plex Sans', -apple-system, sans-serif;
    color:var(--ink);
    max-width:560px;
    margin:0 auto;
  }
  .tw-wrap h2{ font-family:'Fraunces', Georgia, serif; }

  .tw-back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--water-deep);
    text-decoration:none;
    font-size:0.9rem;
    font-weight:600;
    margin-bottom:18px;
  }
  .tw-back:hover{ text-decoration:underline; }

  .tw-editcard{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:30px;
    position:relative;
    overflow:hidden;
  }
  .tw-editcard::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:5px;
    background:linear-gradient(180deg, var(--water) 0%, var(--water-deep) 100%);
  }

  .tw-eyebrow{
    text-transform:uppercase;
    letter-spacing:0.08em;
    font-size:0.72rem;
    color:var(--stone);
    font-weight:600;
    margin:0 0 6px 0;
  }
  .tw-editcard h2{
    margin:0 0 20px 0;
    font-size:1.6rem;
    font-weight:600;
  }

  /* Locked phone chip — visually communicates "this cannot change" */
  .tw-locked{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--paper-dim);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:26px;
  }
  .tw-locked svg{ flex-shrink:0; color:var(--stone); }
  .tw-locked-text{ line-height:1.3; }
  .tw-locked-label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--stone);
    margin:0;
  }
  .tw-locked-value{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.98rem;
    font-weight:600;
    margin:2px 0 0 0;
  }

  /* Form */
  .tw-editcard form p{ margin:0 0 18px 0; }
  .tw-editcard form label{
    display:block;
    font-size:0.82rem;
    font-weight:600;
    color:var(--stone);
    margin-bottom:6px;
  }
  .tw-editcard form input,
  .tw-editcard form select,
  .tw-editcard form textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:9px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.96rem;
    box-sizing:border-box;
    background:#fff;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .tw-editcard form input:focus,
  .tw-editcard form select:focus,
  .tw-editcard form textarea:focus{
    outline:none;
    border-color:var(--water);
    box-shadow:0 0 0 3px rgba(14,107,168,0.15);
  }

  .tw-actions{
    display:flex;
    gap:12px;
    margin-top:6px;
  }
  .tw-save{
    background:var(--flow);
    color:#fff;
    border:none;
    border-radius:9px;
    padding:12px 26px;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    transition:transform 0.08s ease, box-shadow 0.15s ease;
  }
  .tw-save:hover{ box-shadow:0 4px 14px rgba(47,143,78,0.35); }
  .tw-save:active{ transform:translateY(1px); }

  .tw-cancel{
    display:inline-flex;
    align-items:center;
    padding:12px 20px;
    border-radius:9px;
    border:1px solid var(--line);
    color:var(--ink);
    text-decoration:none;
    font-weight:600;
    font-size:0.95rem;
  }
  .tw-cancel:hover{ background:var(--paper-dim); }
</style>

<div class="tw-wrap">

  <a class="tw-back" href="{% url 'tubewell_detail' tubewell.id %}">&larr; Back to {{ tubewell.name }}</a>

  <div class="tw-editcard">
    <p class="tw-eyebrow">Renter Profile</p>
    <h2>Edit {{ renter.first_name }}</h2>

    <div class="tw-locked">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="4" y="10" width="16" height="10" rx="2"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      </svg>
      <div class="tw-locked-text">
        <p class="tw-locked-label">Phone Number &middot; locked</p>
        <p class="tw-locked-value">{{ renter.phone_number }}</p>
      </div>
    </div>

    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="tw-actions">
        <button type="submit" class="tw-save">Save Changes</button>
        <a href="{% url 'tubewell_detail' tubewell.id %}" class="tw-cancel">Cancel</a>
      </div>
    </form>
  </div>

</div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
{% endblock %}
